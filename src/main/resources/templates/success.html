<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <link rel="icon" href="https://static.toss.im/icons/png/4x/icon-toss-logo.png" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment 프로젝트</title>
    <style>
        /* 임시 스타일 */
        .wrapper { padding: 40px; font-family: sans-serif; }
        .flex-column { display: flex; flex-direction: column; }
        .align-center { align-items: center; }
        .w-100 { width: 100%; }
        .max-w-540 { max-width: 540px; margin: auto; }
        .btn { padding: 12px; background: #0064FF; color: white; border: none; border-radius: 8px; cursor: pointer; text-align: center; }
        .btn:hover { background: #0052cc; }
        .response-section { margin-top: 24px; }
        .justify-between { display: flex; justify-content: space-between; padding: 8px 0; }
        .confirm-success { display: none; }
    </style>
</head>
<body>
<div class="wrapper w-100">
    <div class="flex-column align-center confirm-loading w-100 max-w-540">
        <div class="flex-column align-center">
            <img src="https://static.toss.im/lotties/loading-spot-apng.png" width="120" height="120">
            <h2 class="title text-center">결제 요청까지 성공했어요.</h2>
            <h4 class="text-center description">결제 승인하고 완료해보세요.</h4>
        </div>
        <div class="w-100">
            <button id="confirmPaymentButton" class="btn primary w-100">결제 승인하기</button>
        </div>
    </div>

    <div class="flex-column align-center confirm-success w-100 max-w-540">
        <img src="https://static.toss.im/illusts/check-blue-spot-ending-frame.png" width="120" height="120">
        <h2 class="title">결제를 완료했어요</h2>
        <div class="response-section w-100">
            <div class="flex justify-between">
                <span class="response-label">결제 금액</span>
                <span id="amount" class="response-text"></span>
            </div>
            <div class="flex justify-between">
                <span class="response-label">주문번호</span>
                <span id="orderId" class="response-text"></span>
            </div>
            <div class="flex justify-between">
                <span class="response-label">paymentKey</span>
                <span id="paymentKey" class="response-text"></span>
            </div>
        </div>

        <div class="w-100 button-group">
            <div class="flex" style="gap: 16px;">
                <a class="btn w-100" href="https://developers.tosspayments.com/sandbox">다시 테스트하기</a>
                <a class="btn w-100" href="https://docs.tosspayments.com/guides/v2/paymentEvent-widget/integration" target="_blank" rel="noreferrer noopener">결제 연동 문서가기</a>
            </div>
        </div>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const paymentKey = urlParams.get("paymentKey");
    const orderId = urlParams.get("orderId");
    const amount = urlParams.get("amount");

    const paymentKeyEl = document.getElementById("paymentKey");
    const orderIdEl = document.getElementById("orderId");
    const amountEl = document.getElementById("amount");

    const loadingSection = document.querySelector(".confirm-loading");
    const successSection = document.querySelector(".confirm-success");

    document.getElementById("confirmPaymentButton").addEventListener("click", async () => {
        try {
            const response = await fetch("/v1/toss/confirm", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    paymentKey,
                    orderId,
                    amount,
                }),
            });

            const json = await response.json();

            if (!response.ok) {
                alert("결제 승인에 실패했습니다.\n" + json.message);
                return;
            }

            // 승인 성공 처리
            paymentKeyEl.textContent = json.data.paymentKey;
            orderIdEl.textContent = json.data.orderId;
            amountEl.textContent = json.data.amount.toLocaleString() + "원";

            loadingSection.style.display = "none";
            successSection.style.display = "flex";

        } catch (e) {
            alert("서버 통신 중 오류가 발생했습니다.");
            console.error(e);
        }
    });
</script>
</body>
</html>
