<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <title>토스페이먼츠 결제</title>
    <script src="https://js.tosspayments.com/v1/payment-widget"></script>
    <link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="wrapper">
    <div class="box_section" style="padding: 40px 30px;">
        <div id="payment-method"></div>
        <div id="agreement"></div>

        <div style="padding-left: 25px">
            <label>
                <input type="checkbox" id="coupon-box" />
                <span>5,000원 쿠폰 적용</span>
            </label>
        </div>

        <div class="result wrapper">
            <button id="payment-button" style="margin-top: 30px">결제하기</button>
        </div>
    </div>
</div>

<!-- ✅ JavaScript에서 사용할 데이터 (Toss 위젯용) -->
<script th:inline="javascript">
    const orderId = /*[[${orderId}]]*/ '';
    if (!orderId) {
        alert("결제 정보가 누락되었습니다.");
    }
        const orderName = /*[[${orderName}]]*/ '';
    if (!orderName) {
        alert("결제 정보가 누락되었습니다.");
    }
        let amount = /*[[${amount}]]*/ 0;

    const buyerId = /*[[${buyerId}]]*/ 0;

        const clientKey = "test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm";
        const customerKey = btoa(Math.random()).slice(0, 20);

        const paymentWidget = PaymentWidget(clientKey, customerKey);
        const paymentMethodWidget = paymentWidget.renderPaymentMethods(
            "#payment-method",
            { value: amount },
            { variantKey: "DEFAULT" }
        );

        paymentWidget.renderAgreement("#agreement", {
            variantKey: "AGREEMENT"
        });

        document.getElementById("coupon-box").addEventListener("change", function () {
            const discount = this.checked ? 5000 : 0;
            paymentMethodWidget.updateAmount(amount - discount);
        });

        // ✅ 결제 버튼 클릭 시 Toss 결제 → 성공 시 form submit
        document.getElementById("payment-button").addEventListener("click", () => {
            paymentWidget.requestPayment({
                orderId: orderId,
                orderName: orderName,
                successUrl: `${window.location.origin}/v1/toss/success`,
                failUrl: `${window.location.origin}/v1/toss/fail`,
                customerEmail: "customer123@gmail.com",
                customerName: "김토스",
                customerMobilePhone: "01012341234",
            });
        });
</script>

<!-- ✅ 결제 후 주문 확인용 서버 POST form -->
<form id="checkout-form" th:action="@{/checkout}" method="post">

<!--    <input type="hidden" name="cartId" th:value="${cartId}" />-->

<!--    <input type="hidden" name="buyerId" th:value="${buyerId}" />-->
    <input type="hidden" name="orderId" th:value="${orderId}" />
    <input type="hidden" name="orderName" th:value="${orderName}" />
    <input type="hidden" name="amount" th:value="${amount}" />
</form>
</body>
</html>
