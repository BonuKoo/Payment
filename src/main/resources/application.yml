    stream:
      kafka:
        binder:
          brokers: pkc-gq2xn.asia-northeast3.gcp.confluent.cloud:9092
          configuration:
            security:
              protocol: SASL_SSL
            sasl:
              jaas:
                config: org.apache.kafka.common.security.plain.PlainLoginModule required username='WSGNVHNZPXEFWD73' password='Imaot2b9NjkhWvdh6h0a1lw8zP/bvYt1K+HNtUEujqy5oK4SGPf5OMKTXj/c8Zxo';
              mechanism: PLAIN
