server:
  port: 8082

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/payment
    username: root
    password: 1234
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format-sql: true
    open-in-view: false

  cloud:
    stream:
      kafka:
        binder:
          brokers: pkc-e82om.ap-northeast-2.aws.confluent.cloud:9092
          configuration:
            security:
              protocol: SASL_SSL
            sasl:
              jaas:
                config: org.apache.kafka.common.security.plain.PlainLoginModule required username='SWJHFI3EMFCYBGO7' password='7X/bhgJpXB1h2x0H9JTKhBWVz4RNzScRASwjb2dkB5EjrV/P8e9aiRDRxcSAUL5T';
              mechanism: PLAIN
            client:
              dns:
                lookup: use_all_dns_ips

          required-acks: all
          auto-create-topics: false
          transaction:
            transaction-id-prefix: ledger-
            producer:
              configuration:
                transaction:
                  timeout:
                    ms: 30000
        bindings:
          consume-in-0:
            consumer:
              enable-dlq: true
              dlq-name: payment_ledger_dlq
      bindings:
        consume-in-0:
          destination: payment
          group: ledger-service
          consumer:
            max-attempts: 5

logging:
  level:
    org:
      springframework:
        transaction: TRACE
        orm:
          jpa: DEBUG
        kafka: TRACE